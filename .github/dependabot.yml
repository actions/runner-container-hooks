version: 2

updates:
  # Group updates into a single PR per workspace package
  - package-ecosystem: npm
    directory: "/packages/docker"
    schedule:
      interval: weekly
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # ts-jest 29 declares a peer range of >=7.0.0-beta.0 <8 on @babel/core, so
      # bumping Babel to 8 makes the dependency tree unresolvable (ERESOLVE) and
      # breaks `npm install` in the release workflow. Remove these once ts-jest
      # widens its peer range to accept Babel 8.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/preset-env"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/packages/hooklib"
    schedule:
