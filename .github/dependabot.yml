version: 2

updates:
  # Group updates into a single PR per workspace package
  - package-ecosystem: npm
    directory: "/packages/docker"
    schedule:
      interval: weekly
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # Jest's babel-preset-current-node-syntax still pulls syntax plugins that
      # require Babel 7. Remove these once the complete Jest preset supports Babel 8.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/preset-env"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/packages/hooklib"
    schedule:
      interval: weekly
    groups:
      all-dependencies:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/packages/k8s"
    schedule:
      interval: weekly
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # Jest's babel-preset-current-node-syntax still pulls syntax plugins that
      # require Babel 7. Remove these once the complete Jest preset supports Babel 8.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/preset-env"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/packages/k8s-novolume"
    schedule:
      interval: weekly
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # Jest's babel-preset-current-node-syntax still pulls syntax plugins that
      # require Babel 7. Remove these once the complete Jest preset supports Babel 8.
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@babel/preset-env"
        update-types: ["version-update:semver-major"]
